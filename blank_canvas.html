<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>MITA - Blank Canvas</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/png" href="download (1).png">
  <style>
    * {
      font-family: 'Palatino Linotype', 'Book Antiqua', Palatino, serif;
    }
    .top-nav{position:fixed;top:20px;left:20px;display:flex;gap:12px;z-index:120;flex-wrap:wrap}
    .top-nav a{background:#111;border:1px solid rgba(255,255,255,.08);color:#fff;text-decoration:none;padding:12px 18px;border-radius:10px;display:flex;align-items:center;gap:8px;font-size:0.95rem;transition:all 0.2s ease}
    .top-nav a:hover{background:#191919;border-color:rgba(255,255,255,.12);transform:translateY(-1px)}
    .nav-icon{display:flex;align-items:center;width:18px;height:18px}
    .nav-icon svg{width:100%;height:100%;stroke:currentColor;fill:none;stroke-width:2}
    body{background:#0e0e0e;color:#fff;margin:0;padding:0}
    #blank-canvas{position:absolute;top:0;left:0;width:100vw;height:300vh;display:block}
    .tools{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:12px;background:#111;border:1px solid rgba(255,255,255,.08);padding:12px 16px;border-radius:12px;z-index:130;flex-wrap:wrap;max-width:90vw}
    .tools button{color:#fff;background:#1a1a1a;border:1px solid rgba(255,255,255,.08);padding:10px 16px;border-radius:8px;cursor:pointer;font-size:0.95rem;font-family:'Palatino Linotype','Book Antiqua',Palatino,serif;transition:all 0.2s ease}
    .tools button:hover{background:#252525;border-color:rgba(255,255,255,.15)}
    .color-picker-wrapper{display:flex;align-items:center;gap:8px;position:relative}
    .color-picker-toggle{background:#1a1a1a;border:1px solid rgba(255,255,255,.08);color:#fff;padding:10px 16px;border-radius:8px;cursor:pointer;font-size:0.95rem;font-family:'Palatino Linotype','Book Antiqua',Palatino,serif;transition:all 0.2s ease;display:flex;align-items:center;gap:6px}
    .color-picker-toggle:hover{background:#252525}
    .color-picker-toggle svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;transition:transform 0.2s ease}
    .color-picker-toggle.collapsed svg{transform:rotate(180deg)}
    .color-picker{display:flex;gap:8px;align-items:center;transition:all 0.3s ease;overflow:hidden}
    .color-picker.collapsed{max-width:0;opacity:0;pointer-events:none;margin:0;padding:0}
    .color-dot{width:24px;height:24px;border-radius:50%;border:2px solid rgba(255,255,255,.3);cursor:pointer;transition:all 0.2s ease;flex-shrink:0}
    .color-dot:hover{transform:scale(1.15);border-color:rgba(255,255,255,.6)}
    .color-dot.active{border-color:#fff;border-width:3px;box-shadow:0 0 8px rgba(255,255,255,0.4)}
  </style>
</head>
<body>
  <div class="top-nav">
    <a href="home.html">
      <span class="nav-icon">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
          <polyline points="9 22 9 12 15 12 15 22"/>
        </svg>
      </span>
      Home
    </a>
    <a href="question_selector.html">
      <span class="nav-icon">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <rect x="4" y="6" width="16" height="12" rx="2" ry="2"/>
          <line x1="8" y1="10" x2="8" y2="14"/>
          <line x1="12" y1="10" x2="12" y2="14"/>
          <line x1="16" y1="10" x2="16" y2="14"/>
          <circle cx="8" cy="12" r="1.5"/>
          <circle cx="12" cy="12" r="1.5"/>
          <circle cx="16" cy="12" r="1.5"/>
        </svg>
      </span>
      Selector
    </a>
    <a href="stats.html">
      <span class="nav-icon">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <line x1="18" y1="20" x2="18" y2="10"/>
          <line x1="12" y1="20" x2="12" y2="4"/>
          <line x1="6" y1="20" x2="6" y2="14"/>
        </svg>
      </span>
      Stats
    </a>
  </div>

  <canvas id="blank-canvas"></canvas>
  <div class="tools">
    <button id="undo">Undo</button>
    <button id="redo">Redo</button>
    <button id="clear">Clear</button>
    <div class="color-picker-wrapper">
      <button class="color-picker-toggle" id="color-toggle">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <polyline points="6 9 12 15 18 9"/>
        </svg>
        Colors
      </button>
      <div class="color-picker" id="color-picker">
        <div class="color-dot active" data-color="#ffffff" style="background:#ffffff;" title="White"></div>
        <div class="color-dot" data-color="#ff5252" style="background:#ff5252;" title="Red"></div>
        <div class="color-dot" data-color="#ffd54f" style="background:#ffd54f;" title="Yellow"></div>
        <div class="color-dot" data-color="#69f0ae" style="background:#69f0ae;" title="Green"></div>
        <div class="color-dot" data-color="#40c4ff" style="background:#40c4ff;" title="Blue"></div>
        <div class="color-dot" data-color="#ff4081" style="background:#ff4081;" title="Pink"></div>
        <div class="color-dot" data-color="#7c4dff" style="background:#7c4dff;" title="Purple"></div>
        <div class="color-dot" data-color="#ff6f00" style="background:#ff6f00;" title="Orange"></div>
        <div class="color-dot" data-color="#00e676" style="background:#00e676;" title="Light Green"></div>
        <div class="color-dot" data-color="#00bcd4" style="background:#00bcd4;" title="Cyan"></div>
        <div class="color-dot" data-color="#000000" style="background:#000000;border-color:rgba(255,255,255,.5);" title="Black"></div>
        <div class="color-dot" data-color="#9e9e9e" style="background:#9e9e9e;" title="Grey"></div>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('blank-canvas');
    const ctx = canvas.getContext('2d');

    let dpr = window.devicePixelRatio || 1;
    let cssW = 0, cssH = 0;

    let isDrawing=false,lastX=0,lastY=0,color='#ffffff';
    let hist=[], idx=-1, maxSteps=300;

    function setBackingStore(){
      cssW = window.innerWidth;
      cssH = Math.floor(window.innerHeight * 3); // 300vh
      dpr  = window.devicePixelRatio || 1;

      canvas.width  = Math.max(1, Math.floor(cssW * dpr));
      canvas.height = Math.max(1, Math.floor(cssH * dpr));
      canvas.style.width  = cssW + 'px';
      canvas.style.height = cssH + 'px';

      ctx.setTransform(dpr,0,0,dpr,0,0); // 1 unit = 1 CSS px
    }

    function redraw(){
      ctx.setTransform(1,0,0,1,0,0);
      ctx.clearRect(0,0,canvas.width,canvas.height);
      const d = hist[idx];
      if (!d){ ctx.setTransform(dpr,0,0,dpr,0,0); return; }
      const img = new Image();
      img.onload = () => {
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        ctx.setTransform(dpr,0,0,dpr,0,0);
      };
      img.src = d;
    }

    function handleZoomOrResize(){
      const prevDpr = dpr, prevW = cssW, prevH = cssH;
      setBackingStore();
      if (dpr!==prevDpr || cssW!==prevW || cssH!==prevH) redraw();
    }

    // Poll for DPR/zoom reliably
    let _poll=null;
    function startZoomPolling(){
      if (_poll) return;
      let lastD = window.devicePixelRatio || 1;
      let lastW = window.innerWidth, lastH = window.innerHeight;
      _poll = setInterval(()=>{
        const d = window.devicePixelRatio || 1;
        const w = window.innerWidth, h = window.innerHeight;
        if (Math.abs(d-lastD)>1e-6 || w!==lastW || h!==lastH){
          lastD=d; lastW=w; lastH=h;
          handleZoomOrResize();
        }
      },150);
    }

    function pushSnap(){
      try{
        const d = canvas.toDataURL();
        if (idx < hist.length-1) hist = hist.slice(0, idx+1);
        hist.push(d);
        if (hist.length>maxSteps) hist.shift();
        idx = hist.length-1;
      }catch(e){}
    }

    function getPos(e){
      const r = canvas.getBoundingClientRect();
      const t = e.touches && e.touches[0];
      const x = (t ? t.clientX : e.clientX) - r.left;
      const y = (t ? t.clientY : e.clientY) - r.top;
      return {x, y}; // CSS px; context scaled to DPR
    }

    function down(e){
      isDrawing = true;
      ctx.setTransform(dpr,0,0,dpr,0,0);
      const p = getPos(e);
      lastX = p.x; lastY = p.y;
      ctx.beginPath(); ctx.moveTo(lastX, lastY);
    }
    function move(e){
      if (!isDrawing) return;
      ctx.setTransform(dpr,0,0,dpr,0,0);
      ctx.strokeStyle = color; ctx.lineWidth = 2;
      ctx.lineCap='round'; ctx.lineJoin='round';
      const p = getPos(e);
      ctx.lineTo(p.x, p.y); ctx.stroke();
      lastX = p.x; lastY = p.y;
    }
    function up(){
      if (!isDrawing) return;
      isDrawing = false;
      pushSnap();
    }

    function undo(){ if (idx<=0) return; idx--; redraw(); }
    function redo(){ if (idx>=hist.length-1) return; idx++; redraw(); }
    function clear(){ ctx.setTransform(1,0,0,1,0,0); ctx.clearRect(0,0,canvas.width,canvas.height); ctx.setTransform(dpr,0,0,dpr,0,0); pushSnap(); }

    setBackingStore();
    pushSnap(); // baseline
    window.addEventListener('resize', handleZoomOrResize);
    startZoomPolling();

    canvas.addEventListener('mousedown', down);
    canvas.addEventListener('mousemove', move);
    canvas.addEventListener('mouseup', up);
    canvas.addEventListener('mouseout', up);
    canvas.addEventListener('touchstart', down, {passive:true});
    canvas.addEventListener('touchmove', move, {passive:true});
    canvas.addEventListener('touchend', up);

    document.getElementById('undo').onclick = undo;
    document.getElementById('redo').onclick = redo;
    document.getElementById('clear').onclick = clear;
    
    // Color picker toggle
    const colorToggle = document.getElementById('color-toggle');
    const colorPicker = document.getElementById('color-picker');
    let colorPickerCollapsed = false;
    
    colorToggle.addEventListener('click', ()=>{
      colorPickerCollapsed = !colorPickerCollapsed;
      colorPicker.classList.toggle('collapsed', colorPickerCollapsed);
      colorToggle.classList.toggle('collapsed', colorPickerCollapsed);
    });
    
    // Color selection
    document.querySelectorAll('.color-dot').forEach(dot=>{
      dot.addEventListener('click', ()=>{
        color = dot.getAttribute('data-color') || '#ffffff';
        // Update active state
        document.querySelectorAll('.color-dot').forEach(d=>d.classList.remove('active'));
        dot.classList.add('active');
      });
    });

    document.addEventListener('keydown', (e)=>{
      const meta = e.ctrlKey || e.metaKey; if (!meta) return;
      const k = e.key.toLowerCase();
      if (k==='z' && !e.shiftKey){ e.preventDefault(); undo(); }
      else if (k==='y' || (k==='z' && e.shiftKey)){ e.preventDefault(); redo(); }
    });
  </script>
</body>
</html>
