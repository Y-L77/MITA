<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>MITA - Stats</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="icon" type="image/png" href="assets/images/logo.png">
  <style>
    * {
      font-family: 'Palatino Linotype', 'Book Antiqua', Palatino, serif;
    }
    .stats-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0b0b0b;color:#fff;padding:32px 20px}
    .stats-card{width:clamp(320px,96vw,1200px);background:#121212;border:1px solid rgba(255,255,255,.06);border-radius:16px;box-shadow:0 20px 64px rgba(0,0,0,.55);padding:32px}
    .row{display:grid;grid-template-columns:1.2fr .8fr;gap:24px;margin-top:24px}
    @media (max-width:900px){.row{grid-template-columns:1fr}}
    .panel{background:#181818;border:1px solid rgba(255,255,255,.06);border-radius:12px;padding:24px}
    .muted{color:#a7a7a7;font-size:0.95rem}
    .list{display:grid;gap:12px;margin-top:16px}
    .list > div{padding:12px 0;border-bottom:1px solid rgba(255,255,255,.05)}
    .list > div:last-child{border-bottom:none}
    .pill{display:inline-block;padding:6px 12px;border-radius:999px;border:1px solid rgba(255,255,255,.06);background:#0f0f0f;font-size:0.9rem}
    .nav{display:flex;gap:12px;margin-bottom:24px;flex-wrap:wrap}
    .nav a{color:#fff;text-decoration:none;background:#111;border:1px solid rgba(255,255,255,.08);padding:12px 18px;border-radius:10px;display:flex;align-items:center;gap:8px;font-size:0.95rem;transition:all 0.2s ease}
    .nav a:hover{background:#191919;border-color:rgba(255,255,255,.12);transform:translateY(-1px)}
    .nav-icon{display:flex;align-items:center;width:18px;height:18px}
    .nav-icon svg{width:100%;height:100%;stroke:currentColor;fill:none;stroke-width:2}
    h1{margin:0 0 8px 0;font-size:2rem;font-weight:600;letter-spacing:-0.02em}
    #elo-now{font-size:1.3rem;font-weight:600;margin-bottom:8px}
    #streak-line{font-size:1rem;margin-bottom:12px}
    #breakdown strong{font-size:1.1rem;font-weight:600;display:block;margin-bottom:4px}
    #breakdown .muted{font-size:0.9rem}
    #breakdown > div > div:last-child{font-size:1.2rem;font-weight:600;min-width:50px;text-align:right}
  </style>
</head>
<body class="selector">
  <div class="stats-wrap">
    <div class="stats-card">
      <div class="nav">
        <a href="home.html">
          <span class="nav-icon">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
              <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
              <polyline points="9 22 9 12 15 12 15 22"/>
            </svg>
          </span>
          Home
        </a>
        <a href="question_selector.html">
          <span class="nav-icon">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
              <rect x="4" y="6" width="16" height="12" rx="2" ry="2"/>
              <line x1="8" y1="10" x2="8" y2="14"/>
              <line x1="12" y1="10" x2="12" y2="14"/>
              <line x1="16" y1="10" x2="16" y2="14"/>
              <circle cx="8" cy="12" r="1.5"/>
              <circle cx="12" cy="12" r="1.5"/>
              <circle cx="16" cy="12" r="1.5"/>
            </svg>
          </span>
          Selector
        </a>
        <a href="blank_canvas.html">
          <span class="nav-icon">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
              <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
              <path d="M3 9h18M3 15h18M9 3v18M15 3v18"/>
            </svg>
          </span>
          Canvas
        </a>
      </div>
      <h1>Stats & Web Diagram</h1>
      <div class="muted">Performance by category (accuracy %) and overall progress.</div>

      <div class="row">
        <div class="panel">
          <div style="display:flex;justify-content:space-between;align-items:center">
            <div>
              <div id="elo-now" style="font-weight:700">ELO: —</div>
              <div class="muted" id="streak-line">Streak: —</div>
            </div>
            <div><span id="total-line" class="pill">— attempts</span></div>
          </div>
          <svg id="radar" width="640" height="520" style="margin-top:10px;max-width:100%;height:auto"></svg>
        </div>
        <div class="panel">
          <div style="font-weight:700">Breakdown</div>
          <div class="list" id="breakdown"></div>
        </div>
      </div>
    </div>
  </div>
  <script src="assets/js/stats.js"></script>
</body>
</html>
