<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>MITA — Practice</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
  <link rel="stylesheet" href="../assets/css/theme.css">
  <link rel="stylesheet" href="../assets/css/practice-shell.css">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/png" href="../assets/images/logo.png">
  <style>
    #confetti{position:fixed;inset:0;pointer-events:none;z-index:350}
  </style>
</head>

<body class="practice-body">
  <div class="practice-nav">
    <a href="../home.html">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
        <polyline points="9 22 9 12 15 12 15 22"/>
      </svg>
      Home
    </a>
  </div>

  <div id="content-wrapper">
    <!-- Removed ELO header -->
    <!-- <div id="elo-display">ELO: <span id="elo-value">300</span> (<span id="elo-rank">Middle Schooler</span>)</div> -->

    <button id="hidden-focus-helper" aria-hidden="true" style="opacity:0;position:absolute;"></button>

    <canvas id="drawing-canvas"></canvas>

    <!-- Toggle button is SEPARATE from question container -->
    <button id="toggle-question-btn" class="toggle-btn">▲ Hide Question</button>

    <div id="question-container">
      <div id="question" class="question-box"></div>
    </div>
  </div>

  <div class="answer-container">
    <input type="text" id="answer-box" placeholder="Your answer..." autofocus>
    <button id="submit-btn">Submit</button>
    <button id="change-elo-btn" style="display:none">Change ELO</button>
    <button id="clear-drawing-btn">Clear Drawing</button>
  </div>
  <div id="result"></div>
  <div id="next-question-container" style="display:none;">
    <button type="button" id="next-question-persistent-btn">Next question</button>
  </div>

  <div id="color-picker-container">
    <button id="color-picker-btn">
      <span id="current-color-preview"></span>
      Color
    </button>
    <div id="color-dropdown" class="hidden">
      <div class="color-option" data-color="red" style="background:red;"></div>
      <div class="color-option" data-color="yellow" style="background:yellow;"></div>
      <div class="color-option" data-color="green" style="background:green;"></div>
      <div class="color-option" data-color="lightblue" style="background:lightblue;"></div>
      <div class="color-option" data-color="orange" style="background:orange;"></div>
      <div class="color-option" data-color="white" style="background:white;border:1px solid #444;"></div>
      <div class="color-option" data-color="#000000" style="background:#000000"></div>
      <div class="color-option" data-color="#8a2be2" style="background:#8a2be2"></div>
      <div class="color-option" data-color="#00008b" style="background:#00008b"></div>
      <div class="color-option" data-color="#39ff14" style="background:#39ff14;"></div>
    </div>
  </div>

  <div id="result-overlay">
    <div class="result-dialog">
      <div id="result-text"></div>
    </div>
  </div>
  <canvas id="confetti"></canvas>

  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
  <script src="logic.js"></script>
</body>
</html>
