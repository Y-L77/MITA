<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MITA — Select Practice</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,600;1,9..144,300&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #09090b;
      --surface: #111115;
      --surface2: #18181e;
      --border: rgba(255,255,255,0.07);
      --border-hover: rgba(255,255,255,0.14);
      --text: #f0ede8;
      --text-muted: #7a7880;
      --text-dim: #4a4855;
      --accent: #c8b89a;
      --accent-glow: rgba(200,184,154,0.15);

      --clr-combinatorics: #7eb8f7;
      --clr-linear-algebra: #a78bfa;
      --clr-calculus: #f97316;
      --clr-probability: #4ade80;
      --clr-enrichment: #f472b6;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Mono', monospace;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.015) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.015) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
      z-index: 0;
    }

    .page {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr;
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 32px 80px;
    }

    .nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 28px 0 20px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 48px;
    }

    .nav-logo {
      font-family: 'Fraunces', serif;
      font-size: 1.5rem;
      font-weight: 300;
      color: var(--accent);
      letter-spacing: 0.08em;
      text-decoration: none;
    }

    .nav-back {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.78rem;
      letter-spacing: 0.06em;
      transition: color 0.2s;
    }
    .nav-back:hover { color: var(--text); }
    .nav-back svg { width: 14px; height: 14px; }

    .main {
      display: grid;
      grid-template-columns: 1fr 340px;
      gap: 40px;
      align-items: start;
    }

    .left { display: flex; flex-direction: column; gap: 36px; }

    .section-label {
      font-size: 0.65rem;
      letter-spacing: 0.18em;
      color: var(--text-dim);
      text-transform: uppercase;
      margin-bottom: 16px;
    }

    .category-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 12px;
    }

    .cat-card {
      position: relative;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 18px 16px;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s, transform 0.15s;
      background: var(--surface);
      overflow: hidden;
      user-select: none;
    }

    .cat-card::before {
      content: '';
      position: absolute;
      inset: 0;
      opacity: 0;
      transition: opacity 0.2s;
    }

    .cat-card:hover {
      border-color: var(--border-hover);
      transform: translateY(-1px);
    }

    .cat-card.active {
      border-color: var(--cat-color);
      background: color-mix(in srgb, var(--cat-color) 8%, var(--surface));
    }

    .cat-card.active::before {
      background: radial-gradient(ellipse at top left, color-mix(in srgb, var(--cat-color) 12%, transparent), transparent 60%);
      opacity: 1;
    }

    .cat-icon {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: color-mix(in srgb, var(--cat-color) 20%, transparent);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 12px;
    }

    .cat-icon svg {
      width: 15px;
      height: 15px;
      stroke: var(--cat-color);
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .cat-name {
      font-size: 0.82rem;
      font-weight: 500;
      color: var(--text);
      margin-bottom: 6px;
      letter-spacing: 0.03em;
    }

    .cat-elo {
      font-size: 0.75rem;
      color: var(--cat-color);
      font-family: 'DM Mono', monospace;
      letter-spacing: 0.04em;
    }

    .cat-tier {
      font-size: 0.65rem;
      color: var(--text-dim);
      margin-top: 2px;
      letter-spacing: 0.06em;
    }

    .cat-check {
      position: absolute;
      top: 12px;
      right: 12px;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      border: 1.5px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: border-color 0.2s, background 0.2s;
    }

    .cat-card.active .cat-check {
      border-color: var(--cat-color);
      background: var(--cat-color);
    }

    .cat-check svg {
      width: 10px;
      height: 10px;
      stroke: var(--bg);
      fill: none;
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      opacity: 0;
      transition: opacity 0.15s;
    }

    .cat-card.active .cat-check svg { opacity: 1; }

    .filter-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .btn-ghost {
      background: none;
      border: 1px solid var(--border);
      color: var(--text-muted);
      font-family: 'DM Mono', monospace;
      font-size: 0.72rem;
      letter-spacing: 0.06em;
      padding: 6px 14px;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-ghost:hover { border-color: var(--border-hover); color: var(--text); }

    .start-section {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .start-info {
      font-size: 0.72rem;
      color: var(--text-muted);
      letter-spacing: 0.04em;
      line-height: 1.6;
    }

    .btn-start {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: var(--accent);
      color: #09090b;
      border: none;
      border-radius: 10px;
      padding: 16px 32px;
      font-family: 'DM Mono', monospace;
      font-size: 0.85rem;
      font-weight: 500;
      letter-spacing: 0.08em;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.15s;
      text-transform: uppercase;
    }

    .btn-start:hover { opacity: 0.9; transform: translateY(-1px); }
    .btn-start:active { transform: translateY(0); }

    .btn-start svg {
      width: 16px; height: 16px;
      stroke: #09090b;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .right {
      position: sticky;
      top: 32px;
    }

    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 28px 24px;
    }

    .panel-title {
      font-family: 'Fraunces', serif;
      font-size: 1.1rem;
      font-weight: 300;
      color: var(--text);
      margin-bottom: 4px;
      letter-spacing: 0.02em;
    }

    .panel-sub {
      font-size: 0.68rem;
      color: var(--text-dim);
      letter-spacing: 0.08em;
      margin-bottom: 28px;
    }

    .spider-wrap {
      display: flex;
      justify-content: center;
      margin-bottom: 24px;
    }

    #spider-svg { overflow: visible; }

    .elo-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .elo-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .elo-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .elo-row-name {
      flex: 1;
      font-size: 0.72rem;
      color: var(--text-muted);
      letter-spacing: 0.04em;
    }

    .elo-row-val {
      font-size: 0.78rem;
      color: var(--text);
      font-family: 'DM Mono', monospace;
      letter-spacing: 0.04em;
    }

    .elo-row-tier {
      font-size: 0.62rem;
      color: var(--text-dim);
      letter-spacing: 0.04em;
      width: 80px;
      text-align: right;
    }

    .overall-badge {
      display: flex;
      align-items: baseline;
      gap: 8px;
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid var(--border);
    }

    .overall-elo {
      font-family: 'Fraunces', serif;
      font-size: 2.2rem;
      font-weight: 300;
      color: var(--accent);
      letter-spacing: -0.02em;
    }

    .overall-tier {
      font-size: 0.72rem;
      color: var(--text-muted);
      letter-spacing: 0.06em;
    }

    @media (max-width: 820px) {
      .page { padding: 0 20px 60px; }
      .main { grid-template-columns: 1fr; }
      .right { position: static; }
    }

    @media (max-width: 480px) {
      .category-grid { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>
<body>

<div class="page">
  <nav class="nav">
    <a class="nav-logo" href="../home.html">MITA</a>
    <a class="nav-back" href="../home.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M19 12H5M12 19l-7-7 7-7"/>
      </svg>
      Home
    </a>
  </nav>

  <div class="main">
    <div class="left">
      <div>
        <div class="filter-actions">
          <div class="section-label" style="margin-bottom:0">Filter by topic</div>
          <div style="display:flex;gap:8px">
            <button class="btn-ghost" id="select-all-btn">Select All</button>
            <button class="btn-ghost" id="clear-all-btn">Clear</button>
          </div>
        </div>
        <div style="height:14px"></div>
        <div class="category-grid" id="category-grid"></div>
      </div>

      <div class="start-section">
        <p class="start-info" id="start-info">
          Difficulty is chosen automatically based on your ELO in each topic — you'll be challenged at the right level.
        </p>
        <button class="btn-start" id="start-btn">
          <svg viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"/></svg>
          Begin Practice
        </button>
      </div>
    </div>

    <div class="right">
      <div class="panel">
        <div class="panel-title">Your Profile</div>
        <div class="panel-sub">SKILL RATINGS</div>

        <div class="spider-wrap">
          <svg id="spider-svg" width="200" height="200" viewBox="-110 -110 220 220"></svg>
        </div>

        <div class="elo-list" id="elo-list"></div>

        <div class="overall-badge">
          <span class="overall-elo" id="overall-elo">—</span>
          <span class="overall-tier" id="overall-tier">Overall</span>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
const SAVE_KEY = 'mita_save_v4';

const CATEGORIES = [
  { key: 'combinatorics',  label: 'Combinatorics',  color: '#7eb8f7' },
  { key: 'linear-algebra', label: 'Linear Algebra',  color: '#a78bfa' },
  { key: 'calculus',       label: 'Calculus',        color: '#f97316' },
  { key: 'probability',    label: 'Probability',     color: '#4ade80' },
  { key: 'enrichment',     label: 'Enrichment',      color: '#f472b6' },
];

const ELO_TIERS = [
  { min: 0,    name: "Novice" },
  { min: 400,  name: "Apprentice" },
  { min: 700,  name: "Intermediate" },
  { min: 1000, name: "Advanced" },
  { min: 1300, name: "Expert" },
  { min: 1600, name: "Master" },
  { min: 1900, name: "Grandmaster" },
];

const CAT_ICONS = {
  'combinatorics':  `<svg viewBox="0 0 24 24"><circle cx="5" cy="6" r="2"/><circle cx="19" cy="6" r="2"/><circle cx="5" cy="18" r="2"/><circle cx="19" cy="18" r="2"/><line x1="5" y1="8" x2="5" y2="16"/><line x1="19" y1="8" x2="19" y2="16"/><line x1="7" y1="6" x2="17" y2="6"/><line x1="7" y1="18" x2="17" y2="18"/></svg>`,
  'linear-algebra': `<svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>`,
  'calculus':       `<svg viewBox="0 0 24 24"><path d="M6 3C6 3 4 5 4 12s2 9 2 9"/><path d="M18 3c0 0 2 2 2 9s-2 9-2 9"/><path d="M8 12h8"/></svg>`,
  'probability':    `<svg viewBox="0 0 24 24"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>`,
  'enrichment':     `<svg viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>`,
};

function getTier(elo) {
  for (let i = ELO_TIERS.length - 1; i >= 0; i--) {
    if (elo >= ELO_TIERS[i].min) return ELO_TIERS[i].name;
  }
  return ELO_TIERS[0].name;
}

function loadElos() {
  try {
    const s = JSON.parse(localStorage.getItem(SAVE_KEY) || '{}');
    const elos = {};
    CATEGORIES.forEach(c => { elos[c.key] = 300; });
    if (s.categoryElos) Object.assign(elos, s.categoryElos);
    return elos;
  } catch { return Object.fromEntries(CATEGORIES.map(c => [c.key, 300])); }
}

function getOverall(elos) {
  const vals = Object.values(elos);
  return Math.round(vals.reduce((a, b) => a + b, 0) / vals.length);
}

const elos = loadElos();
let activeCategories = new Set(CATEGORIES.map(c => c.key));

try {
  const saved = localStorage.getItem('mita_active_categories');
  if (saved) {
    const arr = JSON.parse(saved);
    if (Array.isArray(arr) && arr.length > 0) activeCategories = new Set(arr);
  }
} catch {}

function renderCards() {
  const grid = document.getElementById('category-grid');
  grid.innerHTML = '';
  CATEGORIES.forEach(cat => {
    const active = activeCategories.has(cat.key);
    const card = document.createElement('div');
    card.className = 'cat-card' + (active ? ' active' : '');
    card.style.setProperty('--cat-color', cat.color);
    card.innerHTML = `
      <div class="cat-icon">${CAT_ICONS[cat.key] || ''}</div>
      <div class="cat-name">${cat.label}</div>
      <div class="cat-elo">${elos[cat.key] ?? 300}</div>
      <div class="cat-tier">${getTier(elos[cat.key] ?? 300)}</div>
      <div class="cat-check">
        <svg viewBox="0 0 12 12"><polyline points="2 6 5 9 10 3"/></svg>
      </div>
    `;
    card.addEventListener('click', () => toggleCat(cat.key));
    grid.appendChild(card);
  });
}

function toggleCat(key) {
  if (activeCategories.has(key)) {
    if (activeCategories.size === 1) return;
    activeCategories.delete(key);
  } else {
    activeCategories.add(key);
  }
  renderCards();
  updateStartInfo();
}

document.getElementById('select-all-btn').addEventListener('click', () => {
  CATEGORIES.forEach(c => activeCategories.add(c.key));
  renderCards();
  updateStartInfo();
});

document.getElementById('clear-all-btn').addEventListener('click', () => {
  activeCategories = new Set([CATEGORIES[0].key]);
  renderCards();
  updateStartInfo();
});

function updateStartInfo() {
  const count = activeCategories.size;
  const all = count === CATEGORIES.length;
  document.getElementById('start-info').textContent = all
    ? "Difficulty is chosen automatically based on your ELO in each topic — you'll be challenged at the right level."
    : `Practising ${count} topic${count > 1 ? 's' : ''}. Difficulty is set automatically to match your current ratings.`;
}

function drawSpider() {
  const svg = document.getElementById('spider-svg');
  const R = 80;
  const cx = 0, cy = 0;
  const n = CATEGORIES.length;
  const MAX_ELO = 2000;

  const angles = CATEGORIES.map((_, i) => (Math.PI * 2 * i / n) - Math.PI / 2);

  function polar(angle, r) {
    return { x: cx + r * Math.cos(angle), y: cy + r * Math.sin(angle) };
  }

  let html = '';

  const rings = [0.25, 0.5, 0.75, 1.0];
  rings.forEach(frac => {
    const pts = angles.map(a => polar(a, R * frac));
    const d = pts.map((p, i) => `${i === 0 ? 'M' : 'L'}${p.x.toFixed(2)},${p.y.toFixed(2)}`).join(' ') + ' Z';
    html += `<path d="${d}" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>`;
  });

  angles.forEach(a => {
    const tip = polar(a, R);
    html += `<line x1="${cx}" y1="${cy}" x2="${tip.x.toFixed(2)}" y2="${tip.y.toFixed(2)}" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>`;
  });

  const pts = CATEGORIES.map((cat, i) => {
    const elo = Math.min(elos[cat.key] ?? 300, MAX_ELO);
    const r = R * (elo / MAX_ELO);
    return polar(angles[i], r);
  });

  const polyPath = pts.map((p, i) => `${i === 0 ? 'M' : 'L'}${p.x.toFixed(2)},${p.y.toFixed(2)}`).join(' ') + ' Z';
  html += `<path d="${polyPath}" fill="rgba(200,184,154,0.12)" stroke="rgba(200,184,154,0.6)" stroke-width="1.5" stroke-linejoin="round"/>`;

  CATEGORIES.forEach((cat, i) => {
    const elo = Math.min(elos[cat.key] ?? 300, MAX_ELO);
    const r = R * (elo / MAX_ELO);
    const p = polar(angles[i], r);
    html += `<circle cx="${p.x.toFixed(2)}" cy="${p.y.toFixed(2)}" r="3.5" fill="${cat.color}"/>`;
  });

  CATEGORIES.forEach((cat, i) => {
    const tip = polar(angles[i], R + 18);
    const anchor = tip.x > 5 ? 'start' : tip.x < -5 ? 'end' : 'middle';
    html += `<text x="${tip.x.toFixed(2)}" y="${tip.y.toFixed(2)}" text-anchor="${anchor}" dominant-baseline="middle" font-family="DM Mono, monospace" font-size="9" fill="${cat.color}" letter-spacing="0.04em">${cat.label.split(' ')[0].toUpperCase()}</text>`;
  });

  svg.innerHTML = html;
}

function renderEloList() {
  const list = document.getElementById('elo-list');
  list.innerHTML = '';
  CATEGORIES.forEach(cat => {
    const elo = elos[cat.key] ?? 300;
    const row = document.createElement('div');
    row.className = 'elo-row';
    row.innerHTML = `
      <div class="elo-dot" style="background:${cat.color}"></div>
      <div class="elo-row-name">${cat.label}</div>
      <div class="elo-row-val">${elo}</div>
      <div class="elo-row-tier">${getTier(elo)}</div>
    `;
    list.appendChild(row);
  });

  const overall = getOverall(elos);
  document.getElementById('overall-elo').textContent = overall;
  document.getElementById('overall-tier').textContent = getTier(overall);
}

document.getElementById('start-btn').addEventListener('click', () => {
  localStorage.setItem('mita_active_categories', JSON.stringify([...activeCategories]));
  window.location.href = 'practice/index.html';
});

renderCards();
drawSpider();
renderEloList();
updateStartInfo();
</script>
</body>
</html>
